name: Test and deploy Pages

on:
  push:
    branches: [main, hyperdetail-continuous-lod]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site
        uses: actions/checkout@v6
        with:
          ref: main
          path: main

      - name: Checkout hyperdetail experiment
        uses: actions/checkout@v6
        with:
          ref: hyperdetail-continuous-lod
          path: hyperdetail

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test and package main
        working-directory: main
        run: |
          npm run build
          npm test
          npm run pages

      - name: Test and package hyperdetail
        working-directory: hyperdetail
        run: |
          npm test
          npm run pages

      - name: Combine Pages artifact
        run: |
          mkdir -p site
          cp -a main/dist/. site/
          mkdir -p site/hyperdetail
          cp -a hyperdetail/dist/. site/hyperdetail/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
